name: Build ZENVIO Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'package.json'
      - 'capacitor.config.ts'
      - 'vite.config.js'
      - '.github/workflows/android-apk.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm install
      - run: npm run build
      - run: npx cap add android
      - name: Configure Google AdMob Android application ID
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          manifest = Path("android/app/src/main/AndroidManifest.xml")
          text = manifest.read_text()
          meta = '<meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="ca-app-pub-3685144280766770~6985134103" />'
          if "com.google.android.gms.ads.APPLICATION_ID" not in text:
              text = re.sub(r'(<application\\b[^>]*>)', r'\\1\\n        ' + meta, text, count=1)
          manifest.write_text(text)
          if "com.google.android.gms.ads.APPLICATION_ID" not in manifest.read_text():
              raise SystemExit("Could not add AdMob application ID to AndroidManifest.xml")
          print("AdMob application ID configured in AndroidManifest.xml")
          PY
      - run: npx cap sync android
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: ZENVIO-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
