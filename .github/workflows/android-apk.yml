name: Build ZENVIO Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'package.json'
      - 'capacitor.config.ts'
      - 'vite.config.js'
      - 'zenvio-icon.png'
      - 'google-services.json'
      - '.github/workflows/android-apk.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm install
      - run: npm run build
      - run: npx cap add android
      - name: Configure Firebase Analytics
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          config = Path("google-services.json")
          if not config.exists():
              raise SystemExit("google-services.json is missing from repository root.")
          import json
          data = json.loads(config.read_text())
          package_name = data["client"][0]["client_info"]["android_client_info"]["package_name"]
          if package_name != "com.zenvio.smarttools":
              raise SystemExit(f"Firebase package mismatch: {package_name}")

          app_config = Path("android/app/google-services.json")
          app_config.parent.mkdir(parents=True, exist_ok=True)
          app_config.write_text(config.read_text())

          root_gradle = Path("android/build.gradle")
          root_text = root_gradle.read_text()
          if "com.google.gms:google-services" not in root_text:
              match = re.search(r"(buildscript\s*\{.*?dependencies\s*\{)", root_text, re.S)
              if not match:
                  raise SystemExit("Could not locate buildscript dependencies in android/build.gradle")
              insert_at = match.end()
              root_text = root_text[:insert_at] + "\n        classpath 'com.google.gms:google-services:4.4.2'" + root_text[insert_at:]
              root_gradle.write_text(root_text)

          app_gradle = Path("android/app/build.gradle")
          app_text = app_gradle.read_text()
          if "com.google.gms.google-services" not in app_text:
              app_gradle.write_text(app_text.rstrip() + "\n\napply plugin: 'com.google.gms.google-services'\n")
          print("Firebase configuration and Google Services Gradle plugin configured.")
          PY
      - name: Configure AdMob application ID
        run: |
          python3 - <<'PY'
          from pathlib import Path
          manifest = Path("android/app/src/main/AndroidManifest.xml")
          text = manifest.read_text()
          meta = '        <meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="ca-app-pub-3685144280766770~6985134103" />'
          if "com.google.android.gms.ads.APPLICATION_ID" not in text:
              if "</application>" not in text:
                  raise SystemExit("Android application tag not found")
              text = text.replace("</application>", meta + "\n    </application>", 1)
          manifest.write_text(text)
          print("AdMob application ID added.")
          PY
      - name: Apply ZENVIO launcher icon
        run: |
          python3 -m pip install pillow
          python3 - <<'PY'
          from PIL import Image
          from pathlib import Path
          source = Image.open("zenvio-icon.png").convert("RGBA")
          sizes = {"mdpi":48, "hdpi":72, "xhdpi":96, "xxhdpi":144, "xxxhdpi":192}
          for density, size in sizes.items():
              folder = Path(f"android/app/src/main/res/mipmap-{density}")
              folder.mkdir(parents=True, exist_ok=True)
              icon = source.copy()
              icon.thumbnail((size, size), Image.Resampling.LANCZOS)
              canvas = Image.new("RGBA", (size, size), (255,255,255,255))
              canvas.alpha_composite(icon, ((size-icon.width)//2, (size-icon.height)//2))
              canvas.save(folder/"ic_launcher.png")
              canvas.save(folder/"ic_launcher_round.png")
              # Adaptive icon foreground: transparent canvas with logo inside Android safe zone.
              fg_size = round(size * 2.25)
              foreground = Image.new("RGBA", (fg_size, fg_size), (0,0,0,0))
              logo = source.copy()
              logo.thumbnail((round(fg_size * 0.66), round(fg_size * 0.66)), Image.Resampling.LANCZOS)
              foreground.alpha_composite(logo, ((fg_size-logo.width)//2, (fg_size-logo.height)//2))
              foreground.save(folder/"ic_launcher_foreground.png")
          print("ZENVIO legacy and adaptive launcher icons generated.")
          PY
      - name: Apply ZENVIO launch screen logo
        run: |
          python3 - <<'PY'
          from PIL import Image
          from pathlib import Path
          import re

          source = Image.open("zenvio-icon.png").convert("RGBA")
          res = Path("android/app/src/main/res")

          # Prepare a centered, square splash artwork for older Android versions.
          drawable = res / "drawable"
          drawable.mkdir(parents=True, exist_ok=True)
          logo = source.copy()
          logo.thumbnail((420, 420), Image.Resampling.LANCZOS)
          canvas = Image.new("RGBA", (512, 512), (16, 26, 53, 255))
          canvas.alpha_composite(logo, ((512-logo.width)//2, (512-logo.height)//2))
          canvas.save(drawable / "splash.png")

          # Explicitly create the launch layer-list instead of relying on a template file.
          (drawable / "launch_background.xml").write_text('''<?xml version="1.0" encoding="utf-8"?>
          <layer-list xmlns:android="http://schemas.android.com/apk/res/android">
              <item>\n                  <shape android:shape="rectangle">\n                      <solid android:color="#101a35" />\n                  </shape>\n              </item>
              <item>
                  <bitmap
                      android:gravity="center"
                      android:src="@drawable/splash" />
              </item>
          </layer-list>
          ''')
          
          # Force the native launch theme (Android 11 and below) to use this launch screen.
          for styles in list(res.glob("values*/styles.xml")) + list(res.glob("values*/themes.xml")):
              xml = styles.read_text()
              if "AppTheme.NoActionBarLaunch" in xml:
                  pattern = r'(<style[^>]*name="AppTheme\.NoActionBarLaunch"[^>]*>)(.*?)(</style>)'
                  def patch(match):
                      body = match.group(2)
                      body = re.sub(r'<item\s+name="android:windowBackground"[^>]*>.*?</item>', '', body, flags=re.S)
                      body += '\n        <item name="android:windowBackground">@drawable/launch_background</item>\n'
                      # Android 12+ splash screen attributes.
                      body = re.sub(r'<item\s+name="(?:android:)?windowSplashScreenAnimatedIcon"[^>]*>.*?</item>', '', body, flags=re.S)
                      body += '\n        <item name="android:windowSplashScreenAnimatedIcon">@drawable/splash</item>\n'
                      return match.group(1) + body + match.group(3)
                  xml = re.sub(pattern, patch, xml, flags=re.S)
                  styles.write_text(xml)

          print("Native ZENVIO splash screen configured in styles/themes XML for Android 11 and Android 12+.")
          PY
      - run: npx cap sync android
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: ZENVIO-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
